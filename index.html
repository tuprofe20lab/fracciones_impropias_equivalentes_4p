<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuProfe20 Lab: Fracciones Impropias y Equivalentes</title>

    <!-- Tailwind CSS, React 18, ReactDOM y Babel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX para renderizado matemático nítido -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            user-select: none;
            font-family: 'Nunito', sans-serif;
        }
        .font-fun { font-family: 'Nunito', sans-serif; }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); }
            100% { transform: translateY(-105vh) rotate(360deg); }
        }
        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(16px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes jellyPop {
            0% { transform: scale3d(.3, .3, .3); opacity: 0; }
            25% { transform: scale3d(1.12, 1.12, 1.12); }
            50% { transform: scale3d(.94, .94, .94); opacity: 1; }
            75% { transform: scale3d(1.04, 1.04, 1.04); }
            100% { transform: scale3d(1, 1, 1); opacity: 1; }
        }
        @keyframes robotFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes robotJump {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-14px); }
        }
        @keyframes robotTalkArmL {
            0%, 100% { transform: rotate(45deg); }
            50% { transform: rotate(95deg); }
        }
        @keyframes robotTalkArmR {
            0%, 100% { transform: rotate(-45deg); }
            50% { transform: rotate(-95deg); }
        }
        @keyframes svgPop {
            0% { opacity: 0; transform: scale(0.75); }
            70% { opacity: 1; transform: scale(1.04); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes confettiExplosion {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; }
        }
        @keyframes pointsZoom {
            0% { transform: scale(0.3) rotate(-6deg); opacity: 0; }
            55% { transform: scale(1.12) rotate(2deg); opacity: 1; }
            75% { transform: scale(0.96) rotate(-1deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes pulseBorder {
            0%, 100% { stroke-opacity: 0.45; }
            50% { stroke-opacity: 1; }
        }
        @keyframes slideRightToLeft {
            0% { opacity: 0; transform: translateX(36px) scale(0.92); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes riseUp {
            0% { transform: translateY(22px) scale(0.8); opacity: 0.2; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes dropDown {
            0% { transform: translateY(-22px) scale(0.8); opacity: 0.2; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes growWhole {
            0% { transform: scale(0.55); opacity: 0.3; }
            70% { transform: scale(1.18); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none !important; }
        .scrollbar-hide { -ms-overflow-style: none !important; scrollbar-width: none !important; }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.35s ease-out forwards; }
        .animate-slideRTL { animation: slideRightToLeft 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-riseUp { animation: riseUp 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-dropDown { animation: dropDown 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-growWhole { animation: growWhole 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-jellyPop { animation: jellyPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-robotFloat { animation: robotFloat 3s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-robotTalkArmL { animation: robotTalkArmL 0.6s ease-in-out infinite; }
        .animate-robotTalkArmR { animation: robotTalkArmR 0.6s ease-in-out infinite 0.1s; }
        .animate-confettiExplosion { animation: confettiExplosion 1.9s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-pointsZoom { animation: pointsZoom 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-pulseBorder { animation: pulseBorder 1.3s ease-in-out infinite; }

        .svg-pop {
            transform-box: fill-box;
            transform-origin: center;
            animation: svgPop 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .katex { font-weight: 800 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; }
        .math-enunciado .katex { font-size: clamp(1rem, 1.55vw, 1.32rem) !important; color: #fde047 !important; }
        .math-step .katex { font-size: clamp(1.05rem, 1.55vw, 1.45rem) !important; color: #0f172a !important; }
        .math-option .katex { font-size: clamp(1.1rem, 1.6vw, 1.48rem) !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        // =========================================================================
        // 1. ICONOS SVG INLINE
        // =========================================================================
        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: paths}} />
        );

        const VolumeX = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' />;
        const Volume2 = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>' />;
        const Rocket = (p) => <Icon {...p} paths='<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const Trophy = (p) => <Icon {...p} paths='<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>' />;
        const CheckCircle = (p) => <Icon {...p} paths='<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>' />;
        const ArrowRight = (p) => <Icon {...p} paths='<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>' />;

        // =========================================================================
        // 2. CONTROLADOR DE AUDIO (WEB AUDIO API)
        // =========================================================================
        const AudioController = {
            ctx: null, muted: false, bgmNode: null,
            init: function() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            },
            startBGM: function() {
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                if (this.bgmNode) return;
                const mainGain = this.ctx.createGain();
                mainGain.gain.value = this.muted ? 0 : 0.05;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 780;
                filter.connect(mainGain);
                mainGain.connect(this.ctx.destination);
                this.bgmNode = { mainGain, filter, interval: null };
                const chords = [ [55, 60, 64, 71], [52, 57, 64, 71], [53, 57, 60, 64], [50, 55, 59, 64] ];
                let chordIndex = 0;
                const playChord = () => {
                    if (this.ctx.state !== 'running') return;
                    const chord = chords[chordIndex];
                    chordIndex = (chordIndex + 1) % chords.length;
                    chord.forEach((midi, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
                        const now = this.ctx.currentTime;
                        const delay = i * 0.2;
                        gain.gain.setValueAtTime(0, now + delay);
                        gain.gain.linearRampToValueAtTime(0.14, now + delay + 2);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 7.5);
                        osc.connect(gain);
                        gain.connect(filter);
                        osc.start(now + delay);
                        osc.stop(now + delay + 7.5);
                    });
                };
                playChord();
                this.bgmNode.interval = setInterval(playChord, 6000);
            },
            play: function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(540, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
                    osc.start(now);
                    osc.stop(now + 0.09);
                } else if (type === 'cut') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(920, now + 0.14);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    osc.start(now);
                    osc.stop(now + 0.14);
                } else if (type === 'success') {
                    osc.disconnect();
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.type = 'triangle';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.065);
                        g.gain.setValueAtTime(0, startTime);
                        g.gain.linearRampToValueAtTime(0.2, startTime + 0.04);
                        g.gain.linearRampToValueAtTime(0, startTime + 0.36);
                        o.start(startTime);
                        o.stop(startTime + 0.36);
                    });
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.linearRampToValueAtTime(165, now + 0.22);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now);
                    osc.stop(now + 0.22);
                } else if (type === 'swoosh') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.exponentialRampToValueAtTime(75, now + 0.18);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                }
            },
            toggleMute: function() {
                this.muted = !this.muted;
                if (this.bgmNode && this.ctx) {
                    this.bgmNode.mainGain.gain.setTargetAtTime(this.muted ? 0 : 0.05, this.ctx.currentTime, 0.1);
                }
                return this.muted;
            }
        };

        // =========================================================================
        // 3. COMPONENTE KATEX
        // =========================================================================
        const MathDisplay = memo(({ latex, className = "", inline = false, align = "center" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(latex, containerRef.current, {
                            displayMode: !inline,
                            throwOnError: false,
                            strict: false,
                            trust: true
                        });
                    } catch (e) {
                        containerRef.current.innerText = latex;
                    }
                }
            }, [latex, inline]);

            if (inline) {
                return <span ref={containerRef} className={`inline-block align-middle ${className}`} />;
            }
            return (
                <div className={`w-full flex items-center ${align === 'center' ? 'justify-center' : 'justify-start'} ${className}`}>
                    <div ref={containerRef} className={align === 'center' ? 'text-center' : 'text-left'} />
                </div>
            );
        });

        // =========================================================================
        // 4. PIZARRA LIBRE SUPERPUESTA (OPCIONAL PARA APUNTES RÁPIDOS)
        // =========================================================================
        const DrawingCanvas = () => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [isDrawMode, setIsDrawMode] = useState(false);
            const [penColor, setPenColor] = useState('#ef4444');
            const activePointerRef = useRef(null);

            const playPop = () => { AudioController.init(); AudioController.startBGM(); AudioController.play('pop'); };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !canvas.parentElement) return;
                const observer = new ResizeObserver((entries) => {
                    for (let entry of entries) {
                        const { width, height } = entry.contentRect;
                        const ctx = canvas.getContext('2d');
                        let imgData = null;
                        if (canvas.width > 0 && canvas.height > 0) {
                            try { imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); } catch (e) {}
                        }
                        canvas.width = width;
                        canvas.height = height;
                        if (imgData) ctx.putImageData(imgData, 0, 0);
                    }
                });
                observer.observe(canvas.parentElement);
                return () => observer.disconnect();
            }, []);

            const startDrawing = (e) => {
                if (!isDrawMode || activePointerRef.current !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 5;
                ctx.strokeStyle = penColor;
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
                activePointerRef.current = e.pointerId;
                canvas.setPointerCapture(e.pointerId);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (activePointerRef.current !== e.pointerId || !isDrawMode) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                const canvas = canvasRef.current;
                const pointer = activePointerRef.current;
                activePointerRef.current = null;
                if (pointer !== null && canvas && canvas.hasPointerCapture(pointer)) canvas.releasePointerCapture(pointer);
                if (isDrawing) { canvas.getContext('2d').closePath(); setIsDrawing(false); }
            };

            const clearCanvas = () => {
                playPop();
                const canvas = canvasRef.current;
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            };

            return (
                <>
                    <div style={{ zIndex: 120 }} className="absolute top-2 right-2 flex items-center gap-1.5 bg-white/90 p-1.5 rounded-xl backdrop-blur-sm shadow-md border border-slate-200 pointer-events-auto">
                        <button
                            onClick={() => { playPop(); setIsDrawMode(!isDrawMode); }}
                            className={`px-2.5 py-1 text-xs font-black rounded-lg border-2 transition-all ${isDrawMode ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-slate-600 border-slate-300'}`}
                        >
                            {isDrawMode ? '🖱️ Volver a Interactuar' : '🖊️ Apuntes Libres'}
                        </button>
                        {isDrawMode && (
                            <>
                                {['#ef4444', '#2563eb', '#16a34a', '#0f172a'].map(c => (
                                    <button
                                        key={c}
                                        onClick={() => { playPop(); setPenColor(c); }}
                                        style={{ backgroundColor: c }}
                                        className={`w-6 h-6 rounded-full border-2 ${penColor === c ? 'border-yellow-300 scale-110' : 'border-white'}`}
                                    />
                                ))}
                                <button onClick={clearCanvas} className="px-2 py-1 text-xs font-black bg-rose-50 text-rose-600 border border-rose-200 rounded-lg">🗑️</button>
                            </>
                        )}
                    </div>
                    <canvas
                        ref={canvasRef}
                        style={{ zIndex: 100, pointerEvents: isDrawMode ? 'auto' : 'none', touchAction: isDrawMode ? 'none' : 'auto' }}
                        className={`absolute inset-0 ${isDrawMode ? 'cursor-crosshair' : ''}`}
                        onPointerDown={startDrawing}
                        onPointerMove={draw}
                        onPointerUp={e => { if (activePointerRef.current === e.pointerId) { draw(e); stopDrawing(); } }}
                        onPointerCancel={stopDrawing}
                    />
                </>
            );
        };

        // =========================================================================
        // 5. DATOS DE LOS 3 BLOQUES (5 EJERCICIOS POR BLOQUE = 15 RETOS)
        // =========================================================================
        const BLOCKS = [
            {
                id: 1,
                title: "Bloque 1",
                name: "Pinta y Relaciona Gráficos",
                shortDesc: "Pinta los 3 gráficos según las fracciones impropias o mixtas y relaciónalos (4 opciones)",
                colorFrom: "from-sky-500",
                colorTo: "to-blue-700",
                badgeBg: "bg-sky-500",
                icon: "🎨",
                exercises: [
                    {
                        id: "1-1",
                        prompt: "Pinta cada gráfico según corresponda y relaciónalo con su fracción impropia (sobra 1 fracción):",
                        graphs: [
                            { id: "g0", label: "Gráfico A", boxes: 3, partsPerBox: 4, targetPainted: 9, targetFracId: "f1", color: "#0ea5e9" },
                            { id: "g1", label: "Gráfico B", boxes: 4, partsPerBox: 3, targetPainted: 10, targetFracId: "f3", color: "#f97316" },
                            { id: "g2", label: "Gráfico C", boxes: 3, partsPerBox: 5, targetPainted: 13, targetFracId: "f0", color: "#10b981" }
                        ],
                        fractions: [
                            { id: "f0", latex: String.raw`\dfrac{13}{5}` },
                            { id: "f1", latex: String.raw`\dfrac{9}{4}` },
                            { id: "f2", latex: String.raw`\dfrac{11}{4}` },
                            { id: "f3", latex: String.raw`\dfrac{10}{3}` }
                        ],
                        explanation: "Gráfico A tiene 9/4 pintados, Gráfico B tiene 10/3 pintados y Gráfico C tiene 13/5 pintados (11/4 era el distractor)."
                    },
                    {
                        id: "1-2",
                        prompt: "Pinta las unidades para representar 3 fracciones impropias y únelas con su tarjeta:",
                        graphs: [
                            { id: "g0", label: "Gráfico A", boxes: 4, partsPerBox: 5, targetPainted: 17, targetFracId: "f2", color: "#0284c7" },
                            { id: "g1", label: "Gráfico B", boxes: 4, partsPerBox: 2, targetPainted: 7, targetFracId: "f0", color: "#ec4899" },
                            { id: "g2", label: "Gráfico C", boxes: 3, partsPerBox: 4, targetPainted: 11, targetFracId: "f3", color: "#8b5cf6" }
                        ],
                        fractions: [
                            { id: "f0", latex: String.raw`\dfrac{7}{2}` },
                            { id: "f1", latex: String.raw`\dfrac{17}{4}` },
                            { id: "f2", latex: String.raw`\dfrac{17}{5}` },
                            { id: "f3", latex: String.raw`\dfrac{11}{4}` }
                        ],
                        explanation: "Gráfico A = 17/5, Gráfico B = 7/2 y Gráfico C = 11/4. ¡Cada denominador indica en cuántas partes se divide cada unidad!"
                    },
                    {
                        id: "1-3",
                        prompt: "Ahora pinta los 3 gráficos y vincúlalos con su número mixto correspondiente (sobra 1):",
                        graphs: [
                            { id: "g0", label: "Gráfico A", boxes: 4, partsPerBox: 3, targetPainted: 10, targetFracId: "f1", color: "#f97316" },
                            { id: "g1", label: "Gráfico B", boxes: 3, partsPerBox: 4, targetPainted: 9, targetFracId: "f3", color: "#10b981" },
                            { id: "g2", label: "Gráfico C", boxes: 3, partsPerBox: 6, targetPainted: 15, targetFracId: "f0", color: "#6366f1" }
                        ],
                        fractions: [
                            { id: "f0", latex: String.raw`2\dfrac{3}{6}` },
                            { id: "f1", latex: String.raw`3\dfrac{1}{3}` },
                            { id: "f2", latex: String.raw`3\dfrac{2}{3}` },
                            { id: "f3", latex: String.raw`2\dfrac{1}{4}` }
                        ],
                        explanation: "Gráfico A = 3 enteros y 1/3 (3 1/3), Gráfico B = 2 enteros y 1/4 (2 1/4), Gráfico C = 2 enteros y 3/6 (2 3/6)."
                    },
                    {
                        id: "1-4",

        // =========================================================================
        // 6. COMPONENTES VISUALES DE CADA BLOQUE
        // =========================================================================

        // --- BLOQUE 1: PINTA LOS 3 GRÁFICOS Y RELACIÓNALOS CON 4 FRACCIONES ---
        const Block1MatchVisual = ({
            exercise,
            cellsByGraph,
            onToggleCell,
            selectedGraphIdx,
            onSelectGraph,
            links,
            onLinkFraction,
            checkedStatus,
            onVerifyMatch,
            onResetExercise
        }) => {
            const { graphs, fractions } = exercise;
            const linkColors = ['#0284c7', '#ea580c', '#059669'];
            const allLinked = Object.keys(links).length === graphs.length;

            // Verificar si una fracción ya está vinculada a algún gráfico
            const getGraphLinkedToFrac = (fracId) => {
                const entry = Object.entries(links).find(([gIdx, fId]) => fId === fracId);
                return entry ? Number(entry[0]) : null;
            };

            return (
                <div className="w-full h-full flex flex-col justify-between gap-2.5 p-2 sm:p-4 overflow-y-auto scrollbar-hide">
                    {/* Instrucción rápida + Reiniciar */}

                        </div>
                        {checkedStatus === null && (
                            <button
                                onClick={onResetExercise}
                                className="px-2.5 py-1 text-xs font-black bg-white text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 active:scale-95"
                            >
                                ↺ Limpiar todo
                            </button>
                        )}

                        {/* COLUMNA IZQUIERDA: 3 GRÁFICOS INTERACTIVOS (7 columnas) */}
                        <div className="lg:col-span-7 flex flex-col gap-2.5">
                            {graphs.map((g, gIdx) => {
                                const gCells = cellsByGraph[gIdx] || [];
                                const paintedCount = gCells.filter(Boolean).length;
                                const isSelected = selectedGraphIdx === gIdx;
                                const linkedFracId = links[gIdx];
                                const linkedFrac = fractions.find(f => f.id === linkedFracId);

                                let rowBorder = isSelected
                                    ? 'border-yellow-400 bg-yellow-50/70 ring-2 ring-yellow-300'
                                    : 'border-slate-200 bg-white';

                                if (checkedStatus !== null) {
                                    const isRowOk = paintedCount === g.targetPainted && linkedFracId === g.targetFracId;
                                    rowBorder = isRowOk
                                        ? 'border-emerald-500 bg-emerald-50'
                                        : 'border-rose-500 bg-rose-50';
                                }

                                return (
                                    <div
                                        key={g.id}
                                        className={`p-2.5 sm:p-3 rounded-2xl border-[3px] shadow-sm transition-all flex flex-col sm:flex-row items-center justify-between gap-2.5 ${rowBorder}`}
                                    >
                                        <div className="flex flex-col items-center sm:items-start gap-1.5 flex-1">
                                            <div className="flex items-center gap-2">
                                                <span
                                                    className="px-2.5 py-0.5 rounded-full text-white text-xs font-black"
                                                    style={{ backgroundColor: linkColors[gIdx] }}
                                                >
                                                    {g.label}
                                                </span>
                                                <span className="text-xs font-extrabold text-slate-600">
                                                    Pintado: <strong>{paintedCount}</strong> / {g.boxes * g.partsPerBox} (unidad de {g.partsPerBox})
                                                </span>
                                            </div>

                                            {/* Unidades del gráfico (el alumno toca para pintar) */}
                                            <div className="flex flex-wrap items-center gap-2">
                                                {Array.from({ length: g.boxes }).map((_, bIdx) => {
                                                    const start = bIdx * g.partsPerBox;
                                                    return (
                                                        <div
                                                            key={bIdx}
                                                            className="flex rounded-xl border-[2.5px] border-slate-800 overflow-hidden bg-slate-200 shadow-xs"
                                                            style={{ width: g.boxes >= 5 ? '64px' : '78px', height: '48px' }}
                                                        >
                                                            {Array.from({ length: g.partsPerBox }).map((__, pIdx) => {
                                                                const cIdx = start + pIdx;
                                                                const lit = gCells[cIdx];
                                                                return (
                                                                    <button
                                                                        key={pIdx}
                                                                        type="button"
                                                                        disabled={checkedStatus !== null}
                                                                        onClick={() => onToggleCell(gIdx, cIdx)}
                                                                        style={{ backgroundColor: lit ? g.color : '#e5e7eb' }}
                                                                        className={`flex-1 h-full transition-colors cursor-pointer ${
                                                                            pIdx < g.partsPerBox - 1 ? 'border-r-[2px] border-dashed border-white' : ''
                                                                        }`}
                                                                    />
                                                                );
                                                            })}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* Botón para vincular este gráfico con una fracción */}
                                        <div className="flex items-center gap-2 shrink-0">
                                            {checkedStatus === null ? (
                                                <button
                                                    type="button"
                                                    onClick={() => onSelectGraph(gIdx)}
                                                    className={`px-3 py-2 rounded-xl font-black text-xs transition-all flex items-center gap-1.5 border-2 ${
                                                        isSelected
                                                            ? 'bg-yellow-400 text-slate-950 border-amber-500 scale-105 shadow-md'
                                                            : linkedFrac
                                                                ? 'bg-indigo-100 text-indigo-900 border-indigo-400'
                                                                : 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-indigo-50'
                                                    }`}
                                                >
                                                    {linkedFrac ? (
                                                        <>
                                                            <span>Unido a:</span>
                                                            <MathDisplay inline latex={linkedFrac.latex} />
                                                        </>
                                                    ) : (
                                                        <span>{isSelected ? '👉 Elige fracción →' : '🔗 Vincular'}</span>
                                                    )}
                                                </button>
                                            ) : (
                                                <div className="text-xs font-black px-2.5 py-1 rounded-lg bg-white border border-slate-300">
                                                    {paintedCount === g.targetPainted && linkedFracId === g.targetFracId ? '✅ Correcto' : `❌ Era ${g.targetPainted}/${g.partsPerBox}`}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* COLUMNA DERECHA: 4 OPCIONES DE FRACCIONES (5 columnas, 1 sobra) */}
                        <div className="lg:col-span-5 bg-slate-100/90 p-3.5 sm:p-4 rounded-2xl border-2 border-slate-200 flex flex-col gap-2.5">
                            <div className="text-xs font-black uppercase tracking-wider text-indigo-700 text-center">
                                {selectedGraphIdx !== null
                                    ? `Selecciona la fracción para ${graphs[selectedGraphIdx].label}:`
                                    : '4 Fracciones Disponibles (1 sobra)'}
                            </div>
                            <div className="grid grid-cols-2 lg:grid-cols-1 gap-2.5">
                                {fractions.map((frac) => {
                                    const linkedByGraphIdx = getGraphLinkedToFrac(frac.id);
                                    const isLinked = linkedByGraphIdx !== null;
                                    const canClick = checkedStatus === null && selectedGraphIdx !== null;

                                    return (
                                        <button
                                            key={frac.id}
                                            type="button"
                                            disabled={!canClick}
                                            onClick={() => onLinkFraction(frac.id)}
                                            className={`p-2.5 sm:p-3 rounded-2xl border-[3px] font-black transition-all flex items-center justify-between px-4 math-option ${
                                                canClick
                                                    ? 'bg-white border-indigo-400 hover:bg-indigo-50 hover:scale-[1.02] cursor-pointer shadow-sm'
                                                    : isLinked
                                                        ? 'bg-indigo-50 border-indigo-400 text-indigo-950'
                                                        : 'bg-white/85 border-slate-300 text-slate-800'
                                            }`}
                                        >
                                            <MathDisplay inline latex={frac.latex} />
                                            {isLinked ? (
                                                <span
                                                    className="px-2.5 py-0.5 rounded-full text-white text-xs font-black"
                                                    style={{ backgroundColor: linkColors[linkedByGraphIdx] }}
                                                >
                                                    {graphs[linkedByGraphIdx].label}
                                                </span>
                                            ) : (
                                                <span className="text-[11px] font-bold text-slate-400">
                                                    {canClick ? 'Tocar para unir' : 'Sin unir'}
                                                </span>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* Botón Comprobar Pintado y Relaciones */}
                    {checkedStatus === null && (
                        <div className="flex justify-center pt-1">
                            <button
                                type="button"
                                disabled={!allLinked}
                                onClick={onVerifyMatch}
                                className="px-7 py-2.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black text-sm sm:text-base shadow-lg hover:brightness-110 active:scale-95 disabled:opacity-40 transition-all"
                            >
                                {allLinked ? '✅ Comprobar Pintado y Relaciones' : `Faltan ${graphs.length - Object.keys(links).length} gráfico(s) por vincular`}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // --- BLOQUE 2: GRÁFICO CENTRAL + CONVERSIÓN ANIMADA DE DERECHA A IZQUIERDA ---
        const Block2AnimatedVisual = ({ exercise, animStep, onNextAnimStep, onReplayAnim }) => {
            const { direction, num, den, whole, rem, color } = exercise;
            const totalBoxes = whole + (rem > 0 ? 1 : 0);

            return (
                <div className="w-full h-full flex flex-col justify-between gap-2.5 p-2 sm:p-4 overflow-y-auto scrollbar-hide">
                    
                    {/* 1. GRÁFICO EN LA PARTE CENTRAL SUPERIOR */}
                    <div className="bg-slate-100/90 rounded-2xl p-3 border-2 border-slate-200 flex flex-col items-center gap-2">
                        <div className="text-xs font-black uppercase tracking-wider text-slate-600">
                            Representación Gráfica ({whole} enteros completos + {rem}/{den})
                        </div>
                        <div className="flex flex-wrap items-center justify-center gap-3">
                            {Array.from({ length: totalBoxes }).map((_, bIdx) => {
                                const filledInThisBox = bIdx < whole ? den : rem;
                                return (
                                    <div key={bIdx} className="flex flex-col items-center gap-1 svg-pop" style={{ animationDelay: `${bIdx * 0.06}s` }}>
                                        <div className="flex rounded-xl border-[3px] border-slate-800 overflow-hidden bg-slate-200 shadow-sm" style={{ width: '96px', height: '54px' }}>
                                            {Array.from({ length: den }).map((__, pIdx) => {
                                                const isLit = pIdx < filledInThisBox;
                                                return (
                                                    <div
                                                        key={pIdx}
                                                        style={{ backgroundColor: isLit ? color : '#e5e7eb' }}
                                                        className={`flex-1 h-full ${pIdx < den - 1 ? 'border-r-2 border-dashed border-white' : ''}`}
                                                    />
                                                );
                                            })}
                                        </div>
                                        <span className="text-[11px] font-black text-slate-700">
                                            {bIdx < whole ? `Entero ${bIdx + 1}` : `Sobra ${rem}/${den}`}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* 2. PARTE INFERIOR: ANIMACIÓN OPERATIVA DE DERECHA A IZQUIERDA */}
                    <div className="flex-1 bg-white rounded-2xl border-[3px] border-indigo-200 p-3 sm:p-4 flex flex-col justify-between shadow-inner">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-1.5">
                            <span className="text-xs font-black uppercase tracking-wider text-indigo-700">
                                {direction === 'improper_to_mixed'
                                    ? 'División Inexacta Animada (Observa de derecha → izquierda)'
                                    : 'Multiplicación y Suma Animada (Observa de derecha → izquierda)'}
                            </span>
                            <button
                                type="button"
                                onClick={onReplayAnim}
                                className="px-2.5 py-0.5 text-[11px] font-black bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-lg hover:bg-indigo-100"

        // --- BLOQUE 3: TRAZAR LÍNEAS DE CORTE (÷2, ÷3, ÷4) Y PINTAR EQUIVALENTES ---
        const Block3Visual = ({ exercise, cutsDone, onMakeCut, targetCells, onToggleTargetCell, onResetBlock3 }) => {
            const {
                baseCols, baseRows, basePaintedCols, basePaintedRows,
                targetCols, targetRows, cutOrientation, cutCount,
                baseColor, targetColor, baseLatex
            } = exercise;

            const isCutComplete = cutsDone >= cutCount;
            const currentRows = cutOrientation === 'horizontal' ? (1 + cutsDone) : baseRows;
            const currentCols = cutOrientation === 'vertical' ? (1 + cutsDone) : baseCols;
            const totalParts = currentRows * currentCols;
            const paintedCount = targetCells.slice(0, totalParts).filter(Boolean).length;

            const isBaseCellPainted = (r, c) => {
                if (basePaintedCols !== undefined) return c < basePaintedCols;
                if (basePaintedRows !== undefined) return r < basePaintedRows;

            return (
                <div className="w-full h-full flex flex-col items-center justify-center gap-3 p-2">

                            </span>

                            </span>

                        <button
                            onClick={onResetBlock3}

                            ↺ Reiniciar trazo
                        </button>
                    </div>

                    <div className="w-full max-w-2xl p-4 sm:p-6 rounded-[1.8rem] border-[3.5px] border-dashed border-emerald-500 bg-white shadow-inner flex flex-col sm:flex-row items-center justify-around gap-4">
                        
                        {/* GRÁFICO IZQUIERDO */}

                                    width: '184px',

                                    return (
                                        <div
                                            key={idx}
                                            style={{ backgroundColor: lit ? baseColor : '#e5e7eb' }}
                                            className={`${c < baseCols - 1 ? 'border-r-[3px] border-dashed border-white' : ''} ${r < baseRows - 1 ? 'border-b-[3px] border-dashed border-white' : ''}`}
                                        />

                            <div className="px-4 py-1 rounded-full text-white font-black text-sm shadow-sm" style={{ backgroundColor: baseColor }}>
                                <MathDisplay inline latex={baseLatex} />
                            </div>
                        </div>

                        <div className="w-12 h-12 rounded-full bg-yellow-300 border-[3px] border-amber-500 flex items-center justify-center text-2xl font-black text-amber-900 shadow-md shrink-0">
                            =
                        </div>

                        {/* GRÁFICO DERECHO INTERACTIVO */}
                        <div className="flex flex-col items-center gap-2.5 relative">
                            <div className="relative">
                                <div
                                    className="grid rounded-2xl border-[4px] border-slate-800 overflow-hidden shadow-md bg-slate-200"
                                    style={{
                                        width: '184px',
                                        height: '138px',
                                        gridTemplateColumns: `repeat(${currentCols}, 1fr)`,
                                        gridTemplateRows: `repeat(${currentRows}, 1fr)`
                                    }}
                                >
                                    {Array.from({ length: totalParts }).map((_, idx) => {
                                        const r = Math.floor(idx / currentCols);
                                        const c = idx % currentCols;
                                        const isPainted = targetCells[idx];
                                        return (
                                            <button
                                                key={idx}
                                                type="button"
                                                onClick={() => onToggleTargetCell(idx)}
                                                style={{ backgroundColor: isPainted ? targetColor : '#e5e7eb' }}
                                                className={`transition-colors duration-150 cursor-pointer flex items-center justify-center focus:outline-none ${
                                                    c < currentCols - 1 ? 'border-r-[2.5px] border-dashed border-white' : ''

                                {!isCutComplete && (

                                            ✂️ Trazar línea {cutOrientation === 'horizontal' ? 'horizontal' : 'vertical'} ({cutsDone + 1}/{cutCount})
                                        </span>
                                    </button>
                                )}
                            </div>

                            <div className="px-4 py-1 rounded-full text-white font-black text-sm shadow-sm" style={{ backgroundColor: targetColor }}>
                                {paintedCount} / {totalParts}
                            </div>
                        </div>
                    </div>

                    <div className="text-xs font-bold text-slate-500 text-center">
                        💡 Pinta exactamente la misma área sombreada que en el gráfico izquierdo y luego marca su fracción equivalente.
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 7. COMPONENTES DECORATIVOS: FONDO FLOTANTE, CELEBRACIÓN +20 PTS Y ROBOT
        // =========================================================================
        const FloatingBackground = memo(() => {
            const symbols = ['17/5', '3⅓', '3/4 = 6/8', '½', '⅓', '20 pts', '✏️', '🎨'];
            const elements = Array.from({ length: 24 }).map((_, i) => ({
                id: i,
                symbol: symbols[i % symbols.length],
                left: `${(i * 4.1 + 2) % 96}%`,
                animationDuration: `${12 + (i % 7) * 2.1}s`,
                animationDelay: `-${(i * 1.3) % 18}s`,
                fontSize: `${1.15 + (i % 4) * 0.5}rem`,
                opacity: 0.08 + (i % 3) * 0.03
            }));
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                    {elements.map((el) => (
                        <div
                            key={el.id}

        });

        // Pantalla completa "¡GANASTE 20 PUNTOS!" al acertar
        const PointsCelebrationOverlay = ({ pointsEarned = 20 }) => {
            const colors = ['#fde047', '#38bdf8', '#f472b6', '#34d399', '#a78bfa', '#fb923c'];
            const pieces = Array.from({ length: 90 }).map((_, i) => ({
                id: i,
                left: `${50 + (Math.random() * 16 - 8)}%`,
                color: colors[i % colors.length],
                tx: `${(Math.random() - 0.5) * 900}px`,
                ty: `${(Math.random() - 0.5) * 780}px`,
                rot: `${Math.random() * 720}deg`,
                delay: `${Math.random() * 0.15}s`
            }));

            return (
                <div className="fixed inset-0 z-[200] pointer-events-none flex items-center justify-center bg-slate-950/55 backdrop-blur-xs">
                    {pieces.map((p) => (
                        <div
                            key={p.id}
                            className="absolute w-4 h-4 rounded-full animate-confettiExplosion"
                            style={{
                                backgroundColor: p.color,
                                '--tx': p.tx,
                                '--ty': p.ty,
                                '--rot': p.rot,
                                animationDelay: p.delay,
                                left: p.left,
                                top: '50%'

                    ))}
                    <div className="animate-pointsZoom bg-gradient-to-br from-yellow-300 via-amber-400 to-orange-500 p-6 sm:p-10 rounded-[2.5rem] border-[6px] border-white shadow-[0_25px_70px_rgba(250,204,21,0.7)] text-center max-w-lg mx-4">
                        <div className="text-5xl sm:text-7xl mb-2">🏆🎉</div>
                        <div className="text-3xl sm:text-5xl font-black text-slate-950 tracking-tight uppercase drop-shadow-sm">
                            ¡GANASTE {pointsEarned} PUNTOS!
                        </div>
                        <div className="mt-2 text-sm sm:text-lg font-extrabold text-amber-950">
                            ¡Excelente razonamiento matemático!
                        </div>
                    </div>
