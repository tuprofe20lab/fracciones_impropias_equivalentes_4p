        };

        const RobotAssistant = ({ mood }) => {
            const isHappy = mood === 'correct';
            return (
                <div className={`relative flex flex-col items-center drop-shadow-xl select-none ${isHappy ? 'animate-robotJump' : 'animate-robotFloat'}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-2.5 h-2.5 rounded-full shadow-[0_0_10px_currentColor] z-10 ${isHappy ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>
                        <div className="w-1.5 h-3 bg-slate-300"></div>
                    </div>
                    <div className="relative z-10 w-12 h-12 sm:w-14 sm:h-14 bg-gradient-to-br from-white to-slate-200 rounded-xl border-[2.5px] border-indigo-400 shadow-xl flex flex-col items-center justify-center p-1">
                        <div className="w-full h-full bg-slate-900 rounded-lg flex flex-col items-center justify-center p-1 shadow-inner border-[1.5px] border-indigo-500">
                            <div className="w-full flex justify-between px-1">
                                <div className={`w-2.5 h-2 rounded-full ${isHappy ? 'bg-emerald-400' : 'bg-cyan-400 animate-pulse'}`}></div>
                                <div className={`w-2.5 h-2 rounded-full ${isHappy ? 'bg-emerald-400' : 'bg-cyan-400 animate-pulse'}`}></div>
                            </div>
                            <div className={`w-3.5 h-1.5 rounded-b-full mt-1.5 ${isHappy ? 'bg-emerald-400' : 'bg-cyan-300'}`}></div>
                        </div>
                    </div>
                    <div className={`absolute top-1/2 -left-1.5 w-2 h-4 bg-slate-200 border-[2px] border-indigo-400 rounded-full z-0 origin-top ${isHappy ? 'animate-robotTalkArmL' : 'rotate-45'}`}></div>
                    <div className={`absolute top-1/2 -right-1.5 w-2 h-4 bg-slate-200 border-[2px] border-indigo-400 rounded-full z-0 origin-top ${isHappy ? 'animate-robotTalkArmR' : '-rotate-45'}`}></div>
                </div>
            );
        };

        // =========================================================================
        // 8. APLICACIÓN PRINCIPAL
        // =========================================================================
        function App() {
            const [view, setView] = useState('home'); // 'home' | 'lab' | 'summary'
            const [blockIdx, setBlockIdx] = useState(0);
            const [exIdx, setExIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [blockScores, setBlockScores] = useState([0, 0, 0]);
            const [completedMap, setCompletedMap] = useState({});
            const [isMuted, setIsMuted] = useState(false);

            // Estado de respuesta y celebración
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [answerStatus, setAnswerStatus] = useState(null); // null | 'correct' | 'wrong'
            const [showCelebration, setShowCelebration] = useState(false);

            // Estados interactivos por bloque
            // Bloque 1: 3 gráficos para pintar y vincular con 4 fracciones
            const [b1CellsByGraph, setB1CellsByGraph] = useState([[], [], []]);
            const [b1SelectedGraph, setB1SelectedGraph] = useState(null);
            const [b1Links, setB1Links] = useState({});

            // Bloque 2: paso de animación (0, 1, 2)
            const [b2AnimStep, setB2AnimStep] = useState(0);

            // Bloque 3: cortes y celdas pintadas
            const [b3Cuts, setB3Cuts] = useState(0);
            const [b3Cells, setB3Cells] = useState([]);

            const curBlock = BLOCKS[blockIdx];
            const curEx = curBlock.exercises[exIdx];

            // Inicializar estado interactivo al cambiar de ejercicio
            useEffect(() => {
                setSelectedOpt(null);
                setAnswerStatus(null);
                setShowCelebration(false);

                if (blockIdx === 0) {
                    setB1CellsByGraph(
                        curEx.graphs.map(g => Array(g.boxes * g.partsPerBox).fill(false))
                    );
                    setB1SelectedGraph(null);
                    setB1Links({});
                } else if (blockIdx === 1) {
                    setB2AnimStep(0);
                } else if (blockIdx === 2) {
                    setB3Cuts(0);
                    const maxCells = curEx.targetCols * curEx.targetRows;
                    const initialBaseTotal = curEx.baseCols * curEx.baseRows;
                    const initArr = Array(maxCells).fill(false);
                    for (let i = 0; i < initialBaseTotal; i++) {
                        const r = Math.floor(i / curEx.baseCols);
                        const c = i % curEx.baseCols;
                        if (curEx.basePaintedCols !== undefined && c < curEx.basePaintedCols) initArr[i] = true;
                        if (curEx.basePaintedRows !== undefined && r < curEx.basePaintedRows) initArr[i] = true;
                    }
                    setB3Cells(initArr);
                }
            }, [blockIdx, exIdx]);

            const handleInteraction = () => {
                AudioController.init();
                AudioController.startBGM();
            };

            const startBlock = (bIndex) => {
                handleInteraction();
                AudioController.play('swoosh');
                setBlockIdx(bIndex);
                setExIdx(0);
                setView('lab');
            };

            const registerResult = (isCorrect) => {
                const key = `${blockIdx}-${exIdx}`;
                if (isCorrect) {
                    setAnswerStatus('correct');
                    AudioController.play('success');
                    if (!completedMap[key]) {
                        setScore(s => s + 20);
                        setBlockScores(prev => {
                            const copy = [...prev];
                            copy[blockIdx] += 20;
                            return copy;
                        });
                        setCompletedMap(prev => ({ ...prev, [key]: 'correct' }));
                    }
                    setShowCelebration(true);
                    setTimeout(() => setShowCelebration(false), 1850);
                } else {
                    setAnswerStatus('wrong');
                    AudioController.play('wrong');
                    if (!completedMap[key]) {
                        setCompletedMap(prev => ({ ...prev, [key]: 'wrong' }));
                    }
                }
            };

            const handleSelectOption = (optIndex) => {
                if (answerStatus !== null) return;
                handleInteraction();
                setSelectedOpt(optIndex);
                const chosen = curEx.options[optIndex];
                registerResult(chosen.correct);
            };

            // Verificación específica para Bloque 1 (3 gráficos pintados y vinculados)
            const handleVerifyBlock1 = () => {
                if (answerStatus !== null) return;
                handleInteraction();
                const allCorrect = curEx.graphs.every((g, gIdx) => {
                    const painted = (b1CellsByGraph[gIdx] || []).filter(Boolean).length;
                    const linkedFrac = b1Links[gIdx];
                    return painted === g.targetPainted && linkedFrac === g.targetFracId;
                });
                registerResult(allCorrect);
            };

            const handleNextExercise = () => {
                handleInteraction();
                AudioController.play('swoosh');
                setShowCelebration(false);
                if (exIdx < curBlock.exercises.length - 1) {
                    setExIdx(exIdx + 1);
                } else {
                    setView('summary');
                }
            };

            const toggleMute = () => {
                handleInteraction();
                setIsMuted(AudioController.toggleMute());
            };

            // ------------------------- VISTA PORTADA -------------------------
            if (view === 'home') {
                return (
                    <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#1e3a8a] via-[#4338ca] to-[#be185d] flex flex-col items-center justify-start p-4 sm:p-6 relative font-fun overflow-y-auto scrollbar-hide">
                        <FloatingBackground />

                        {/* Barra superior */}
                        <div className="w-[96%] max-w-[1380px] z-20 flex items-center justify-between mb-6 mt-1">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-yellow-300 bg-white/15 backdrop-blur-md text-yellow-300 font-black tracking-wider uppercase shadow-md text-xs sm:text-base">
                                <Rocket className="w-5 h-5 text-yellow-300" /> TuProfe20 Lab
                            </div>
                            <div className="flex items-center gap-2.5">
                                <div className="px-4 py-2 rounded-2xl bg-yellow-400 text-slate-950 font-black text-xs sm:text-base shadow-md flex items-center gap-1.5">
                                    <Trophy className="w-4 h-4 sm:w-5 sm:h-5" /> Puntaje Total: {score} pts
                                </div>
                                <button onClick={toggleMute} title="Audio" className="p-2.5 rounded-2xl bg-white/20 border-2 border-white/30 backdrop-blur-md text-white hover:bg-white/30 transition-all active:scale-95">
                                    {isMuted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}
                                </button>
                            </div>
                        </div>

                        {/* Títulos de portada */}
                        <div className="relative z-10 text-center w-[96%] max-w-[1380px] flex flex-col items-center pb-10">
                            <span className="px-5 py-1.5 rounded-full bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 font-black uppercase tracking-widest text-xs sm:text-sm mb-3 shadow-lg">
                                Laboratorio Interactivo • 3 Bloques • 15 Retos
                            </span>
                            <h1 className="text-4xl sm:text-6xl md:text-7xl font-black text-white mb-4 drop-shadow-[0_6px_0_rgba(0,0,0,0.3)] tracking-tight leading-tight uppercase">
                                TuProfe20 Lab:<br />
                                <span className="text-yellow-300 underline decoration-wavy decoration-cyan-400 underline-offset-8">
                                    Fracciones Impropias y Equivalentes
                                </span>
                            </h1>
                            <p className="text-sm sm:text-lg text-purple-100 mb-8 font-bold max-w-3xl leading-relaxed">
                                ¡Traza cortes, pinta fracciones, convierte paso a paso y gana <strong>+20 puntos</strong> por cada ejercicio resuelto! 🎯🎨✂️
                            </p>

                            {/* 3 Tarjetas de Bloques */}
                            <div className="w-full grid grid-cols-1 md:grid-cols-3 gap-5 sm:gap-7">
                                {BLOCKS.map((blk, idx) => (
                                    <button
                                        key={blk.id}
                                        onClick={() => startBlock(idx)}
                                        className="group text-left p-6 rounded-[2rem] bg-white/12 backdrop-blur-xl border-[3.5px] border-white/35 hover:border-yellow-300 hover:-translate-y-2 hover:shadow-[0_20px_35px_rgba(0,0,0,0.4)] transition-all flex flex-col justify-between relative overflow-hidden shadow-xl min-h-[16rem]"
                                    >
                                        <div className={`absolute inset-0 bg-gradient-to-br ${blk.colorFrom} ${blk.colorTo} opacity-85 group-hover:opacity-100 transition-opacity`}></div>
                                        <div className="relative z-10 flex flex-col h-full justify-between">
                                            <div className="flex items-center justify-between mb-3">
                                                <span className="bg-white text-slate-900 text-xs font-black px-3.5 py-1 rounded-full uppercase tracking-wider shadow-sm">
                                                    {blk.title} • 5 Retos
                                                </span>
                                                <span className="text-3xl">{blk.icon}</span>
                                            </div>
                                            <div>
                                                <h2 className="text-2xl sm:text-3xl font-black text-white mb-2 drop-shadow-md">
                                                    {blk.name}
                                                </h2>
                                                <p className="text-white/95 text-sm sm:text-base font-bold leading-snug">
                                                    {blk.shortDesc}
                                                </p>
                                            </div>
                                            <div className="mt-5 pt-3 border-t border-white/25 flex items-center justify-between">
                                                <span className="text-yellow-300 font-black text-sm">
                                                    Puntos bloque: {blockScores[idx]} / 100
                                                </span>
                                                <span className="px-3.5 py-1.5 rounded-xl bg-yellow-400 text-slate-950 font-black text-xs uppercase group-hover:scale-105 transition-transform">
                                                    ¡Comenzar! →
                                                </span>
                                            </div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // ------------------------- VISTA RESUMEN DE BLOQUE -------------------------
            if (view === 'summary') {
                return (
                    <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#0f172a] via-[#312e81] to-[#831843] flex flex-col items-center justify-center p-4 relative font-fun overflow-hidden">
                        <FloatingBackground />
                        <div className="relative z-10 bg-white rounded-[2.2rem] border-[6px] border-yellow-400 p-6 sm:p-10 max-w-xl w-full text-center shadow-2xl animate-jellyPop">
                            <div className="text-6xl mb-3">🏅</div>
                            <span className="px-4 py-1 rounded-full bg-indigo-100 text-indigo-800 font-black text-xs uppercase tracking-widest">
                                ¡{curBlock.title} Completado!
                            </span>
                            <h2 className="text-3xl sm:text-4xl font-black text-slate-900 mt-2 mb-2">
                                {curBlock.name}
                            </h2>
                            <p className="text-slate-600 font-bold text-sm sm:text-base mb-6">
                                Completaste los 5 ejercicios interactivos de este bloque.
                            </p>

                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4">
                                    <div className="text-xs font-black text-amber-700 uppercase">Puntos del Bloque</div>
                                    <div className="text-3xl font-black text-amber-600 mt-1">{blockScores[blockIdx]} / 100</div>
                                </div>
                                <div className="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4">
                                    <div className="text-xs font-black text-emerald-700 uppercase">Puntaje Global</div>
                                    <div className="text-3xl font-black text-emerald-600 mt-1">{score} pts</div>
                                </div>
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3 justify-center">
                                <button
                                    onClick={() => setView('home')}
                                    className="px-5 py-3 rounded-xl bg-slate-200 text-slate-800 font-black text-sm hover:bg-slate-300 transition-all"
                                >
                                    🏠 Ir a la Portada
                                </button>
                                {blockIdx < BLOCKS.length - 1 && (
                                    <button
                                        onClick={() => startBlock(blockIdx + 1)}
                                        className="px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black text-sm shadow-lg hover:brightness-110 transition-all"
                                    >
                                        Ir al {BLOCKS[blockIdx + 1].title} →
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // ------------------------- VISTA LABORATORIO ACTIVO -------------------------
            const robotMessage = answerStatus === 'correct'
                ? "¡Excelente! +20 puntos directos a tu marcador. Pulsa 'Siguiente Ejercicio' para continuar."
                : answerStatus === 'wrong'
                    ? `¡Buen intento! ${curEx.explanation || "Revisa la explicación y avanza al siguiente reto."}`
                    : blockIdx === 0
                        ? "Primero pinta cada uno de los 3 gráficos según la fracción que le corresponde, luego únelos con las 4 opciones de la derecha."
                        : blockIdx === 1
                            ? "Observa el gráfico central y avanza los pasos de derecha a izquierda para ver cómo se transforma la fracción."
                            : "Primero traza las líneas de corte en el gráfico derecho, luego pinta el mismo tamaño y marca la fracción equivalente.";

            return (
                <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#0f172a] via-[#312e81] to-[#831843] text-slate-800 flex flex-col p-2 sm:p-3.5 relative font-fun overflow-hidden">
                    <FloatingBackground />
                    {showCelebration && <PointsCelebrationOverlay pointsEarned={20} />}

                    {/* Barra superior */}
                    <div className="shrink-0 relative z-10 w-[98%] max-w-[1440px] mx-auto flex justify-between items-center mb-2 px-1 gap-2">
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => { AudioController.play('swoosh'); setView('home'); }}
                                className="flex items-center justify-center px-3 py-2 rounded-xl bg-white/10 border-2 border-white/30 backdrop-blur-md text-white font-black hover:bg-white/20 transition-all text-xs sm:text-sm"
                            >
                                <Home className="w-4 h-4 sm:mr-1.5" />
                                <span className="hidden sm:inline">Portada</span>
                            </button>
                            <span className="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/10 border border-cyan-400/40 text-cyan-300 font-black text-xs uppercase">
                                {curBlock.title}: {curBlock.name}
                            </span>
                        </div>

                        {/* Indicador de los 5 ejercicios del bloque */}
                        <div className="flex items-center gap-1.5 bg-black/35 p-1.5 rounded-xl border-2 border-white/20 backdrop-blur-md">
                            {curBlock.exercises.map((item, i) => {
                                const status = completedMap[`${blockIdx}-${i}`];
                                return (
                                    <div
                                        key={item.id}
                                        className={`w-8 h-8 sm:w-9 sm:h-9 rounded-lg font-black text-xs sm:text-sm flex items-center justify-center transition-all ${
                                            exIdx === i
                                                ? 'bg-yellow-400 text-slate-950 scale-110 shadow-md'
                                                : status === 'correct'
                                                    ? 'bg-emerald-500 text-white'
                                                    : status === 'wrong'
                                                        ? 'bg-rose-500 text-white'
                                                        : 'bg-white/10 text-white/75'
                                        }`}
                                    >
                                        {i + 1}
                                    </div>
                                );
                            })}
                        </div>

                        <div className="flex items-center gap-2">
                            <div className="px-3.5 py-2 rounded-xl bg-yellow-400 text-slate-950 font-black text-xs sm:text-sm shadow-md flex items-center gap-1.5">
                                <Trophy className="w-4 h-4" /> {score} pts
                            </div>
                            <button onClick={toggleMute} className="p-2 rounded-xl bg-white/10 border-2 border-white/30 text-white hover:bg-white/20">
                                {isMuted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}
                            </button>
                        </div>
                    </div>

                    {/* Pizarra Principal */}
                    <div className="flex-1 min-h-0 relative z-10 w-[98%] max-w-[1440px] mx-auto bg-white rounded-[1.8rem] sm:rounded-[2.2rem] border-[5px] border-slate-100 shadow-2xl flex flex-col overflow-hidden">
                        
                        {/* Enunciado superior */}
                        <div className="shrink-0 bg-slate-900 border-b-[4px] border-cyan-500 px-4 py-2.5 sm:px-6 sm:py-3 flex flex-col justify-center relative z-20">
                            <div className="flex justify-between items-center w-full max-w-6xl mx-auto mb-1">
                                <span className="bg-cyan-400 text-slate-950 font-black text-xs px-3 py-0.5 rounded-md uppercase tracking-wider">
                                    {curBlock.title} • Ejercicio {exIdx + 1} de 5
                                </span>
                                <span className="text-yellow-300 font-extrabold text-xs bg-white/10 px-3 py-0.5 rounded-md">
                                    Valor: +20 puntos
                                </span>
                            </div>
                            <div className="text-white font-bold text-sm sm:text-lg text-center w-full max-w-5xl mx-auto leading-snug">
                                {curEx.prompt}
                            </div>
                        </div>

                        {/* Área interactiva central */}
                        {blockIdx === 0 ? (
                            /* BLOQUE 1: ZONA DE TRABAJO COMPLETA (3 GRÁFICOS + 4 FRACCIONES) */
                            <div className="flex-1 min-h-0 flex flex-col bg-slate-50 overflow-y-auto relative z-10">
                                <Block1MatchVisual
                                    exercise={curEx}
                                    cellsByGraph={b1CellsByGraph}
                                    onToggleCell={(gIdx, cIdx) => {
                                        handleInteraction();
                                        AudioController.play('pop');
                                        setB1CellsByGraph(prev =>
                                            prev.map((arr, idx) =>
                                                idx === gIdx ? arr.map((v, i) => (i === cIdx ? !v : v)) : arr
                                            )
                                        );
                                    }}
                                    selectedGraphIdx={b1SelectedGraph}
                                    onSelectGraph={(gIdx) => {
                                        handleInteraction();
                                        AudioController.play('pop');
                                        setB1SelectedGraph(prev => (prev === gIdx ? null : gIdx));
                                    }}
                                    links={b1Links}
                                    onLinkFraction={(fracId) => {
                                        if (b1SelectedGraph === null) return;
                                        handleInteraction();
                                        AudioController.play('cut');
                                        setB1Links(prev => {
                                            const updated = { ...prev };
                                            // Si esta fracción ya estaba asignada a otro gráfico, la liberamos
                                            Object.keys(updated).forEach(k => {
                                                if (updated[k] === fracId) delete updated[k];
                                            });
                                            updated[b1SelectedGraph] = fracId;
                                            return updated;
                                        });
                                        setB1SelectedGraph(null);
                                    }}
                                    checkedStatus={answerStatus}
                                    onVerifyMatch={handleVerifyBlock1}
                                    onResetExercise={() => {
                                        handleInteraction();
                                        AudioController.play('swoosh');
                                        setB1CellsByGraph(curEx.graphs.map(g => Array(g.boxes * g.partsPerBox).fill(false)));
                                        setB1SelectedGraph(null);
                                        setB1Links({});
                                    }}
                                />

                                {answerStatus !== null && (
                                    <div className="px-4 pb-3 flex justify-center">
                                        <div className={`p-3 rounded-2xl border-2 text-center animate-slideInRight max-w-2xl w-full flex flex-col sm:flex-row items-center justify-between gap-3 ${
                                            answerStatus === 'correct'
                                                ? 'bg-emerald-50 border-emerald-400 text-emerald-900'
                                                : 'bg-amber-50 border-amber-400 text-amber-950'
                                        }`}>
                                            <div className="text-left">
                                                <div className="font-black text-sm">
                                                    {answerStatus === 'correct'
                                                        ? '🎉 ¡Todo pintado y relacionado correctamente! +20 puntos'
                                                        : '💡 ¡Buen intento! Revisa las marcas verdes/rojas y avanza (0 pts)'}
                                                </div>
                                                <p className="text-xs font-bold opacity-90">{curEx.explanation}</p>
                                            </div>
                                            <button
                                                onClick={handleNextExercise}
                                                className="shrink-0 py-2.5 px-5 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-black text-sm shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center gap-2"
                                            >
                                                <span>{exIdx < 4 ? 'Siguiente Ejercicio' : `Finalizar ${curBlock.title}`}</span>
                                                <ArrowRight className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>
                                )}

                                <DrawingCanvas />
                            </div>
                        ) : (
                            /* BLOQUES 2 Y 3: LABORATORIO VISUAL + OPCIONES DE RESPUESTA */
                            <div className="flex-1 min-h-0 flex flex-col lg:flex-row bg-slate-50 overflow-y-auto lg:overflow-hidden relative">
                                
                                <div className="w-full lg:w-[60%] flex-1 p-3 sm:p-5 flex items-center justify-center border-b-2 lg:border-b-0 lg:border-r-2 border-slate-200 relative z-10">
                                    {blockIdx === 1 && (
                                        <Block2AnimatedVisual
                                            exercise={curEx}
                                            animStep={b2AnimStep}
                                            onNextAnimStep={() => {
                                                handleInteraction();
                                                AudioController.play('pop');
                                                setB2AnimStep(s => Math.min(2, s + 1));
                                            }}
                                            onReplayAnim={() => {
                                                handleInteraction();
                                                AudioController.play('swoosh');
                                                setB2AnimStep(0);
                                            }}
                                        />
                                    )}

                                    {blockIdx === 2 && (
                                        <Block3Visual
                                            exercise={curEx}
                                            cutsDone={b3Cuts}
                                            onMakeCut={() => {
                                                handleInteraction();
                                                AudioController.play('cut');
                                                const nextCuts = Math.min(curEx.cutCount, b3Cuts + 1);
                                                setB3Cuts(nextCuts);
                                                if (nextCuts === curEx.cutCount) {
                                                    setB3Cells(Array(curEx.targetCols * curEx.targetRows).fill(false));
                                                }
                                            }}
                                            targetCells={b3Cells}
                                            onToggleTargetCell={(idx) => {
                                                if (b3Cuts < curEx.cutCount) return;
                                                handleInteraction();
                                                AudioController.play('pop');
                                                setB3Cells(prev => prev.map((v, i) => i === idx ? !v : v));
                                            }}
                                            onResetBlock3={() => {
                                                handleInteraction();
                                                AudioController.play('swoosh');
                                                setB3Cuts(0);
                                                const maxCells = curEx.targetCols * curEx.targetRows;
                                                const initialBaseTotal = curEx.baseCols * curEx.baseRows;
                                                const initArr = Array(maxCells).fill(false);
                                                for (let i = 0; i < initialBaseTotal; i++) {
                                                    const r = Math.floor(i / curEx.baseCols);
                                                    const c = i % curEx.baseCols;
                                                    if (curEx.basePaintedCols !== undefined && c < curEx.basePaintedCols) initArr[i] = true;
                                                    if (curEx.basePaintedRows !== undefined && r < curEx.basePaintedRows) initArr[i] = true;
                                                }
                                                setB3Cells(initArr);
                                            }}
                                        />
                                    )}
                                </div>

                                <div className="w-full lg:w-[40%] p-4 sm:p-6 flex flex-col justify-center gap-4 bg-white relative z-10">
                                    <div className="text-xs font-black uppercase tracking-widest text-indigo-600 text-center">
                                        Selecciona tu respuesta:
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 sm:gap-4 max-w-md mx-auto w-full">
                                        {curEx.options.map((opt, idx) => {
                                            const letters = ['A', 'B', 'C', 'D'];
                                            const isChosen = selectedOpt === idx;
                                            let cardStyle = "bg-slate-50 border-slate-300 text-slate-900 hover:border-indigo-500 hover:bg-indigo-50";

                                            if (answerStatus !== null) {
                                                if (opt.correct) {
                                                    cardStyle = "bg-emerald-100 border-emerald-500 text-emerald-950 scale-[1.03] shadow-md";
                                                } else if (isChosen && !opt.correct) {
                                                    cardStyle = "bg-rose-100 border-rose-500 text-rose-950 opacity-90";
                                                } else {
                                                    cardStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                                                }
                                            }

                                            return (
                                                <button
                                                    key={idx}
                                                    disabled={answerStatus !== null}
                                                    onClick={() => handleSelectOption(idx)}
                                                    className={`p-3 sm:p-4 rounded-2xl border-[3px] font-black transition-all flex items-center justify-center gap-2.5 cursor-pointer relative math-option ${cardStyle}`}
                                                >
                                                    <span className="w-7 h-7 rounded-lg bg-slate-800 text-white text-xs font-black flex items-center justify-center shrink-0">
                                                        {letters[idx]}
                                                    </span>
                                                    <MathDisplay inline latex={opt.latex} />
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {answerStatus !== null && (
                                        <div className={`p-3.5 rounded-2xl border-2 text-center animate-slideInRight max-w-md mx-auto w-full ${
                                            answerStatus === 'correct'
                                                ? 'bg-emerald-50 border-emerald-400 text-emerald-900'
                                                : 'bg-amber-50 border-amber-400 text-amber-950'
                                        }`}>
                                            <div className="font-black text-sm sm:text-base mb-1">
                                                {answerStatus === 'correct'
                                                    ? '🎉 ¡Respuesta Correcta! +20 puntos'
                                                    : '💡 ¡No pasa nada! Seguimos avanzando (0 pts)'}
                                            </div>
                                            {curEx.explanation && (
                                                <p className="text-xs font-bold opacity-90 mb-3">{curEx.explanation}</p>
                                            )}
                                            <button
                                                onClick={handleNextExercise}
                                                className="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-black text-sm shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2"
                                            >
                                                <span>{exIdx < 4 ? 'Siguiente Ejercicio' : `Finalizar ${curBlock.title}`}</span>
                                                <ArrowRight className="w-4 h-4" />
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <DrawingCanvas />
                            </div>
                        )}

                        {/* Barra inferior del Robot Guía */}
                        <div className="shrink-0 bg-white w-full px-4 py-2 sm:px-6 sm:py-2.5 flex items-center gap-3 sm:gap-5 border-t-[3px] border-slate-100 z-30 relative">
                            <div className="shrink-0">
                                <RobotAssistant mood={answerStatus} />
                            </div>
                            <div className="flex-1 text-xs sm:text-sm md:text-base font-bold text-slate-700 leading-snug bg-blue-50/90 px-3.5 py-2 rounded-2xl border-2 border-blue-100 flex items-center">
                                {robotMessage}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
